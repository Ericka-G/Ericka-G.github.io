<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ericka Guillén | Portfolio</title>
<link rel="stylesheet" href="https://use.typekit.net/xrz4urw.css">
  <style>
    /* =====================================
       CONFIGURACIÓN GENERAL
    ===================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #080808;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }


    /* =====================================
       PORTADA PRINCIPAL
    ===================================== */

    .portada {
  width: 100%;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  /* ESPACIO SUPERIOR PARA SEPARAR LAS REDES DE LA IMAGEN */
  padding: 130px 24px 24px;

  position: relative;
  overflow: hidden;
  background-color: #080808;
}

    .portada::before {
      content: "";
      display: block;
      width: 100%;
      aspect-ratio: 2376 / 1480;
      background-image: url("PORTADA-2026.png");
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;

      /* DESVANECIMIENTO DE LA IMAGEN */
      opacity: calc(1 - var(--fade, 0));
      transition: opacity 0.05s linear;
      pointer-events: none;
    }


    /* =====================================
       BOTONES DE REDES SOCIALES
    ===================================== */

    .redes {
      position: absolute;
      top: 30px;
      right: 35px;
      display: flex;
      gap: 18px;
      align-items: center;
      z-index: 5;
    }

    .redes a {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      color: #c9a0ff;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 1px;

      transition:
        color 0.3s ease,
        transform 0.3s ease,
        text-shadow 0.3s ease;
    }

    .redes svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .redes a:hover {
      color: #ffffff;
      transform: translateY(-3px);
      text-shadow: 0 0 10px rgba(201, 160, 255, 0.9);
    }


    /* =====================================
       INDICADOR DE SCROLL
    ===================================== */

    .indicador {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      color: #ffffff;
      font-size: 11px;
      letter-spacing: 3px;
      text-align: center;
      white-space: nowrap;
      opacity: 0.8;
      z-index: 5;
      animation: flotar 2s ease-in-out infinite;
    }

    @keyframes flotar {
      0%, 100% {
        transform: translate(-50%, 0);
      }

      50% {
        transform: translate(-50%, -6px);
      }
    }


    /* =====================================
       SECCIÓN DE ÍNDICE
    ===================================== */

 .indice h2 {
  font-family: "gloridot", sans-serif;
  font-style: normal;
  font-weight: 400;
  font-size: 40px;
  letter-spacing: 5px;
}


    /* =====================================
       ADAPTACIÓN PARA CELULARES
    ===================================== */

    @media (max-width: 600px) {
  .portada {
    padding: 90px 12px 12px;
  }
}

      .redes {
        top: 18px;
        right: 18px;
        gap: 12px;
      }

      .redes a {
        font-size: 9px;
      }

      .redes svg {
        width: 13px;
        height: 13px;
      }

      .indicador {
        font-size: 9px;
        bottom: 20px;
        letter-spacing: 2px;
      }

      .indice {
        padding: 60px 8%;
      }

      .indice h2 {
        font-size: 30px;
      }
    }

  </style>
</head>


<body>

  <!-- =====================================
       PORTADA
  ====================================== -->

  <section class="portada">

    <!-- REDES SOCIALES -->

    <div class="redes">

      <!-- INSTAGRAM -->
      <a href="https://www.instagram.com/dood_le.fbx"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="Instagram">

        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="18" cy="6" r="0.8"
                  fill="currentColor" stroke="none"/>
        </svg>

        ✦INSTAGRAM✦
      </a>


      <!-- TIKTOK -->
      <a href="https://www.tiktok.com/@dood_le.fbx"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="TikTok">

        <svg viewBox="0 0 24 24">
          <path d="M14 3v11.2a4.2 4.2 0 1 1-4-4.2"/>
          <path d="M14 3c.4 2.8 2.1 4.5 5 4.8"/>
        </svg>

        ✦TIKTOK✦
      </a>


      <!-- LINKEDIN -->
      <a href="https://www.linkedin.com/in/ericka-guillen"
         target="_blank"
         rel="noopener noreferrer"
         aria-label="LinkedIn">

        <svg viewBox="0 0 24 24">
          <path d="M5 9v10"/>
          <path d="M5 5v.1"/>
          <path d="M10 19v-6a3 3 0 0 1 6 0v6"/>
          <path d="M10 13v-4"/>
          <path d="M16 19v-6"/>
        </svg>

        ✦LINKEDIN✦
      </a>

    </div>


    <!-- INDICADOR INFERIOR -->

    <div class="indicador">
     ↓ ✦SCROLL DOWN TO EXPLORE MY WORK✦ ↓
    </div>

  </section>



  <!-- =====================================
       ÍNDICE DEL PORTAFOLIO
       AQUÍ AGREGAREMOS EL CONTENIDO
       DE LAS SIGUIENTES SECCIONES
  ====================================== -->

  <section class="indice" id="indice">

    <h2>ÍNDICE</h2>

    <!-- AQUÍ AGREGAREMOS TUS PROYECTOS -->

  </section>



  <!-- =====================================
       SCRIPT PARA DESVANECER LA PORTADA
  ====================================== -->

  <script>

    window.addEventListener("scroll", function() {

      const desplazamiento = window.scrollY;

      const alturaPantalla = window.innerHeight;

      const progreso = Math.min(
        desplazamiento / (alturaPantalla * 0.75),
        1
      );

      document.querySelector(".portada")
        .style.setProperty("--fade", progreso);

    });

  </script>

</body>
</html>
