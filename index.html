<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portfolio 2026</title>

  <style>
    /* ==================================
       1. CONFIGURACIÓN GENERAL
       ================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #080808;
      font-family: Helvetica, Arial, sans-serif;
      color: white;
    }

    /* ==================================
       2. PORTADA CON TU IMAGEN
       ================================== */

    
/* PORTADA: IMAGEN PROPORCIONAL Y CON MÁRGENES */

.portada {
  width: 100%;
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 24px;

  position: relative;
  overflow: hidden;

  background-color: #080808;
}

/* IMAGEN DE PORTADA */

.portada::before {
  content: "";
  display: block;

  width: 100%;
  aspect-ratio: 2376 / 1480;

  background-image: url("PORTADA-2026.png");
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;

  transition: width 0.25s ease;
}

/* AJUSTE PARA CELULARES */

@media (max-width: 600px) {
  .portada {
    padding: 12px;
  }
}

    /* ==================================
       3. BOTONES DE REDES SOCIALES
       ================================== */

    .redes {
      position: absolute;
      bottom: 35px;
      right: 40px;

      display: flex;
      gap: 12px;
      align-items: center;
    }

    .redes a {
      color: white;
      text-decoration: none;

      border: 1px solid #c9a0ff;
      padding: 10px 16px;

      font-size: 12px;
      letter-spacing: 1px;

      transition: 0.3s;
    }

    .redes a:hover {
      background-color: #c9a0ff;
      color: #080808;
    }

    /* ==================================
       4. INDICADOR PARA DESLIZAR
       ================================== */

    .indicador {
      position: absolute;
      bottom: 35px;
      left: 40px;

      color: white;
      font-size: 11px;
      letter-spacing: 2px;
      opacity: 0.8;
    }

    /* ==================================
       5. ESPACIO DEL ÍNDICE
       ================================== */

    .indice {
      min-height: 100vh;
      padding: 100px 8%;
      background: #080808;
    }

    .indice h2 {
      color: #c9a0ff;
      font-size: clamp(35px, 6vw, 70px);
      margin-bottom: 40px;
    }

    /* Aquí agregaremos los apartados
       del portafolio más adelante. */

    /* ==================================
       6. ADAPTACIÓN PARA CELULARES
       ================================== */

    @media (max-width: 600px) {

      .portada {
        background-position: center;
      }

      .redes {
        right: 15px;
        bottom: 20px;
        gap: 6px;
      }

      .redes a {
        padding: 9px 10px;
        font-size: 10px;
      }

      .indicador {
        left: 15px;
        bottom: 85px;
        font-size: 9px;
      }
    }

  </style>
</head>

<body>

  <!-- ==================================
       PORTADA PRINCIPAL
       ================================== -->

  <section class="portada">

    <!-- BOTONES DE REDES SOCIALES -->

    <div class="redes">

      <!-- CAMBIA LOS ENLACES POR LOS TUYOS -->

      <a href="https://www.instagram.com/TUUSUARIO/"
         target="_blank">
        INSTAGRAM
      </a>

      <a href="https://www.tiktok.com/@TUUSUARIO"
         target="_blank">
        TIKTOK
      </a>

      <a href="https://www.linkedin.com/in/TUPERFIL/"
         target="_blank">
        LINKEDIN
      </a>

    </div>

    <!-- INDICADOR DE DESPLAZAMIENTO -->

    <div class="indicador">
      SCROLL TO EXPLORE ↓
    </div>

  </section>


  <!-- ==================================
       ÍNDICE (LO DESARROLLAREMOS DESPUÉS)
       ================================== -->

  <section class="indice" id="indice">

    <h2>ÍNDICE</h2>

    <!-- AQUÍ COLOCAREMOS LAS SECCIONES -->

  </section>

</body>
</html>
