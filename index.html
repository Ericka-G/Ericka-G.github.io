<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ericka Guillén | Portfolio</title>

  <!-- TIPOGRAFÍA ADOBE FONTS -->
  <link rel="stylesheet" href="https://use.typekit.net/xrz4urw.css">

  <style>

    /* =====================================
       CONFIGURACIÓN GENERAL
    ===================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #080808;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }


    /* =====================================
       PORTADA PRINCIPAL
    ===================================== */

    .portada {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 130px 24px 24px;
      position: relative;
      overflow: hidden;
      background-color: #080808;
    }

    .portada::before {
      content: "";
      display: block;
      width: 96%;
      max-width: 1800px;
      aspect-ratio: 2376 / 1480;
      background-image: url("PORTADA-2026.png");
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
    }


    /* =====================================
       MENÚ PRINCIPAL SUPERIOR IZQUIERDO
    ===================================== */

    .menu-principal {
      position: fixed;
      top: 30px;
      left: 35px;
      display: flex;
      align-items: center;
      gap: 22px;
      z-index: 20;
    }

    .menu-principal a,
    .boton-menu {
      color: #c9a0ff;
      text-decoration: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      letter-spacing: 1px;
      font-weight: 400;

      transition:
        color 0.3s ease,
        transform 0.3s ease,
        text-shadow 0.3s ease;
    }

    .menu-principal a:hover,
    .boton-menu:hover {
      color: #ffffff;
      transform: translateY(-3px);
      text-shadow: 0 0 10px rgba(201, 160, 255, 0.9);
    }

    .menu-home {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* BOTÓN ÍNDICE */

    .menu-indice {
      position: relative;
    }

    .boton-menu {
      background: none;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .flecha-menu {
      font-size: 9px;
      transition: transform 0.3s ease;
    }

    .menu-indice:hover .flecha-menu,
    .menu-indice:focus-within .flecha-menu,
    .menu-indice.abierto .flecha-menu {
      transform: rotate(180deg);
    }

    /* MENÚ DESPLEGABLE */

    .submenu {
      position: absolute;
      top: 28px;
      left: -12px;
      min-width: 205px;
      padding: 12px 0;

      background: rgba(12, 8, 18, 0.95);
      border: 1px solid rgba(201, 160, 255, 0.3);
      border-radius: 8px;

      display: flex;
      flex-direction: column;
      gap: 0;

      opacity: 0;
      visibility: hidden;
      transform: translateY(8px);

      transition:
        opacity 0.3s ease,
        transform 0.3s ease,
        visibility 0.3s ease;

      backdrop-filter: blur(10px);
    }

    .menu-indice:hover .submenu,
    .menu-indice:focus-within .submenu,
    .menu-indice.abierto .submenu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .submenu a {
      display: block;
      padding: 11px 15px;
      font-size: 10px;
      letter-spacing: 1.5px;
      white-space: nowrap;
    }

    .submenu a:hover {
      background: rgba(201, 160, 255, 0.13);
      transform: none;
      text-shadow: 0 0 9px rgba(201, 160, 255, 0.9);
    }


    /* =====================================
       REDES SOCIALES
    ===================================== */

    .redes {
      position: fixed;
      top: 30px;
      right: 35px;
      display: flex;
      gap: 18px;
      align-items: center;
      z-index: 5;
    }

    .redes a {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      color: #c9a0ff;
      text-decoration: none;
      font-size: 11px;
      letter-spacing: 1px;

      transition:
        color 0.3s ease,
        transform 0.3s ease,
        text-shadow 0.3s ease;
    }

    .redes svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .redes a:hover {
      color: #ffffff;
      transform: translateY(-3px);
      text-shadow: 0 0 10px rgba(201, 160, 255, 0.9);
    }


    /* =====================================
       BOTÓN PARA IR AL ÍNDICE
    ===================================== */

    .indicador {
      position: absolute;
      bottom: 55px;
      left: 50%;
      transform: translateX(-50%);

      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 10px;

      padding: 12px 22px;

      color: #ffffff;
      background: rgba(15, 10, 22, 0.45);
      border: 1px solid rgba(201, 160, 255, 0.65);
      border-radius: 30px;

      font-size: 10px;
      letter-spacing: 2px;
      text-align: center;
      white-space: nowrap;
      text-decoration: none;

      z-index: 5;

      transition:
        color 0.3s ease,
        background 0.3s ease,
        box-shadow 0.3s ease,
        transform 0.3s ease;
    }

    .indicador:hover {
      color: #ffffff;
      background: rgba(95, 45, 130, 0.45);
      box-shadow:
        0 0 10px rgba(201, 160, 255, 0.45),
        0 0 25px rgba(201, 160, 255, 0.2);

      transform: translate(-50%, -4px);
    }


    /* =====================================
   SECCIÓN DEL ÍNDICE
===================================== */

.indice {
  min-height: 100vh;
  width: 100%;
  padding: 100px 24px;
  background-color: #080808;

  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  position: relative;
  overflow: hidden;
  isolation: isolate;
  scroll-margin-top: 0;
}

/* MOSTRAR EL ÍNDICE AL SELECCIONARLO */

.indice.visible {
  display: flex;
}

/* IMAGEN ANIMADA DE FONDO */

.indice::before {
  content: "";
  position: absolute;
  inset: -12%;

  background-image: url("fondo-git.png");
  background-size: 90% 90%;
  background-position: center;
  background-repeat: no-repeat;

  z-index: -1;
  pointer-events: none;

  animation: movimiento-aurora 35s ease-in-out infinite alternate;
}

/* MOVIMIENTO Y DISTORSIÓN LENTA */

@keyframes movimiento-aurora {
  0% {
    transform: translate(-3%, -1%) scale(1.05) skewX(-1deg);
  }

  50% {
    transform: translate(1%, 2%) scale(1.10) skewX(1deg);
  }

  100% {
    transform: translate(3%, -1%) scale(1.06) skewX(-1deg);
  }
}


    /* =====================================
       TÍTULO ÍNDICE - GLORIDOT
    ===================================== */

    .titulo-indice-wrap {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 65px;

      transform: translateY(-100px);
    }

    .indice h2 {
      font-family: "gloridot", sans-serif;
      font-style: normal;
      font-weight: 400;
      font-size: 300px;
      letter-spacing: 5px;
      color: #ffffff;
      display: flex;
      gap: 5px;
    }

    /* ANIMACIÓN DE LETRAS ONDULANTES */

    .indice h2 span {
      display: inline-block;
      animation: onda 2.8s ease-in-out infinite;
    }

    .indice h2 span:nth-child(1) {
      animation-delay: 0s;
    }

    .indice h2 span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .indice h2 span:nth-child(3) {
      animation-delay: 0.3s;
    }

    .indice h2 span:nth-child(4) {
      animation-delay: 0.45s;
    }

    .indice h2 span:nth-child(5) {
      animation-delay: 0.6s;
    }

    .indice h2 span:nth-child(6) {
      animation-delay: 0.75s;
    }

    @keyframes onda {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-9px);
      }
    }


    /* =====================================
       PARTÍCULAS ALREDEDOR DE ÍNDICE
    ===================================== */

    .particula {
      position: absolute;
      color: #c9a0ff;
      pointer-events: none;
      animation: destello 2.5s ease-in-out infinite;
    }

    .particula:nth-child(1) {
      top: -20px;
      left: 5%;
      font-size: 13px;
      animation-delay: 0s;
    }

    .particula:nth-child(2) {
      top: 15px;
      right: 5%;
      font-size: 9px;
      animation-delay: 0.7s;
    }

    .particula:nth-child(3) {
      bottom: -15px;
      left: 18%;
      font-size: 10px;
      animation-delay: 1.2s;
    }

    .particula:nth-child(4) {
      bottom: 0;
      right: 17%;
      font-size: 14px;
      animation-delay: 1.7s;
    }

    @keyframes destello {
      0%, 100% {
        opacity: 0.15;
        transform: scale(0.7);
        text-shadow: 0 0 2px #c9a0ff;
      }

      50% {
        opacity: 1;
        transform: scale(1.35);
        text-shadow:
          0 0 8px #c9a0ff,
          0 0 18px #c9a0ff;
      }
    }


    /* =====================================
       CATEGORÍAS DEL ÍNDICE
    ===================================== */

    .categorias {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      width: 100%;
    }

    .categoria {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 15px;

      color: #ffffff;
      text-decoration: none;

      font-size: clamp(15px, 2.2vw, 21px);
      letter-spacing: 3px;
      font-weight: 400;

      padding: 8px 14px;
      border-radius: 8px;

      transition:
        color 0.35s ease,
        background-color 0.35s ease,
        transform 0.35s ease,
        text-shadow 0.35s ease;
    }

    .categoria:hover,
    .categoria:focus-visible,
    .categoria:active {
      color: #E8C5FF;
      background-color: rgba(25, 8, 38, 0.75);
      text-shadow: 0 0 12px rgba(218, 160, 255, 0.8);
      transform: scale(1.04);
    }

    /* ESTRELLAS DE LAS CATEGORÍAS */

    .categoria .estrella {
      color: #c9a0ff;
      display: inline-block;
      font-size: 17px;

      animation: estrella 2s ease-in-out infinite;

      transition:
        transform 0.35s ease,
        text-shadow 0.35s ease;
    }

    .categoria:nth-child(2) .estrella {
      animation-delay: 0.6s;
    }

    .categoria:nth-child(3) .estrella {
      animation-delay: 1.2s;
    }

    @keyframes estrella {
      0%, 100% {
        opacity: 0.5;
        text-shadow: 0 0 3px #c9a0ff;
      }

      50% {
        opacity: 1;
        text-shadow:
          0 0 8px #c9a0ff,
          0 0 16px #c9a0ff;
      }
    }


    /* =====================================
       HALO DEL CURSOR
    ===================================== */

    #halo-cursor {
      position: fixed;
      top: 0;
      left: 0;
      width: 22px;
      height: 22px;
      border-radius: 50%;

      background: rgba(201, 160, 255, 0.15);
      box-shadow:
        0 0 10px rgba(201, 160, 255, 0.55),
        0 0 24px rgba(201, 160, 255, 0.25);

      pointer-events: none;
      z-index: 9998;

      transform: translate(-50%, -50%);
      opacity: 0;
    }

    /* PARTÍCULAS QUE DEJA EL CURSOR */

    .estela-particula {
      position: fixed;
      top: 0;
      left: 0;

      color: #c9a0ff;
      font-size: 12px;

      pointer-events: none;
      z-index: 9999;

      text-shadow:
        0 0 5px #c9a0ff,
        0 0 12px #c9a0ff;

      transform: translate(-50%, -50%);
      animation: desaparecer 750ms ease-out forwards;
    }

    @keyframes desaparecer {
      0% {
        opacity: 0.95;
        transform: translate(-50%, -50%) scale(1);
      }

      100% {
        opacity: 0;
        transform: translate(-50%, -100%) scale(0.2);
      }
    }


    /* =====================================
       ADAPTACIÓN PARA CELULARES
    ===================================== */

    @media (max-width: 600px) {

      .portada {
        padding: 110px 12px 12px;
      }

      .portada::before {
        width: 100%;
      }

      .menu-principal {
        top: 18px;
        left: 18px;
        gap: 14px;
      }

      .menu-principal a,
      .boton-menu {
        font-size: 9px;
      }

      .submenu {
        min-width: 190px;
      }

      .redes {
        top: 52px;
        right: 18px;
        gap: 12px;
      }

      .redes a {
        font-size: 9px;
      }

      .redes svg {
        width: 13px;
        height: 13px;
      }

      .indicador {
        font-size: 9px;
        bottom: 20px;
        letter-spacing: 1.5px;
        padding: 10px 16px;
      }

      .indice {
        padding: 60px 20px;
      }

      .titulo-indice-wrap {
        margin-bottom: 55px;
      }

      .indice h2 {
        font-size: 48px;
        gap: 2px;
      }

      .categorias {
        gap: 28px;
      }

      .categoria {
        font-size: 13px;
        letter-spacing: 1.5px;
        gap: 9px;
      }

      .categoria .estrella {
        font-size: 13px;
      }

      /* No mostramos el efecto de cursor en celulares */

      #halo-cursor,
      .estela-particula {
        display: none;
      }
    }


    /* =====================================
       RESPETAR PREFERENCIAS DE MOVIMIENTO
    ===================================== */

    @media (prefers-reduced-motion: reduce) {

      .indice h2 span,
      .particula,
      .categoria .estrella,
      .indice::before {
        animation: none;
      }

      html {
        scroll-behavior: auto;
      }
    }

  </style>
</head>

  ===================================== -->

  <section class="indice" id="indice">


    <!-- TÍTULO ANIMADO -->

    <div class="titulo-indice-wrap">

      <h2 aria-label="Índice">
        <span aria-hidden="true">Í</span>
        <span aria-hidden="true">N</span>
        <span aria-hidden="true">D</span>

        <span class="estrella">✦</span>
      </a>

  <!-- =====================================

  ===================================== -->

  <!-- =====================================
       SCRIPT: MENÚ DESPLEGABLE
  ===================================== -->

  <script>

  const portada = document.querySelector(".portada");
  const indice = document.querySelector(".indice");

  const menuIndice = document.getElementById("menuIndice");
  const botonIndice = document.getElementById("botonIndice");

  /* MOSTRAR EL ÍNDICE */

  botonIndice.addEventListener("click", function(event) {

    event.preventDefault();

    portada.style.display = "none";
    indice.classList.add("visible");

    menuIndice.classList.add("abierto");
    botonIndice.setAttribute("aria-expanded", "true");

    window.scrollTo(0, 0);

  });

  /* VOLVER A HOME */

  document.querySelector(".menu-home").addEventListener("click", function(event) {

    event.preventDefault();

    indice.classList.remove("visible");
    portada.style.display = "flex";

    menuIndice.classList.remove("abierto");
    botonIndice.setAttribute("aria-expanded", "false");

    window.scrollTo(0, 0);

  });

  /* CERRAR EL MENÚ AL HACER CLIC FUERA */

  document.addEventListener("click", function(event) {

    if (!menuIndice.contains(event.target)) {

      menuIndice.classList.remove("abierto");
      botonIndice.setAttribute("aria-expanded", "false");

    }

  });

  /* CERRAR EL MENÚ AL ELEGIR UNA CATEGORÍA */

  document.querySelectorAll(".submenu a").forEach(function(enlace) {

    enlace.addEventListener("click", function() {

      menuIndice.classList.remove("abierto");
      botonIndice.setAttribute("aria-expanded", "false");

    });

  });

</script>



  <!-- =====================================
       SCRIPT: HALO Y ESTELA DEL CURSOR
  ===================================== -->

  <script>

    const halo = document.getElementById("halo-cursor");

    const puedeUsarMouse = window.matchMedia(
      "(hover: hover) and (pointer: fine)"
    ).matches;

    if (puedeUsarMouse) {

      let ultimaX = 0;
      let ultimaY = 0;
      let primerMovimiento = true;

      window.addEventListener("pointermove", function(event) {

        const x = event.clientX;
        const y = event.clientY;

        /* MOVIMIENTO DEL HALO */

        halo.style.left = x + "px";
        halo.style.top = y + "px";
        halo.style.opacity = "1";

        /* CREAR PARTÍCULAS CADA CIERTA DISTANCIA */

        const distancia = Math.hypot(
          x - ultimaX,
          y - ultimaY
        );

        if (primerMovimiento || distancia > 16) {

          const particula = document.createElement("span");

          particula.className = "estela-particula";
          particula.textContent = "✦";

          particula.style.left = x + "px";
          particula.style.top = y + "px";

          document.body.appendChild(particula);

          particula.addEventListener("animationend", function() {
            particula.remove();
          });

          ultimaX = x;
          ultimaY = y;
          primerMovimiento = false;

        }

      });

      window.addEventListener("pointerleave", function() {
        halo.style.opacity = "0";
      });

    }

  </script>
