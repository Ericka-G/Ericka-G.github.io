<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Portfolio 2026</title>

  <style>
    /* ==================================
       1. CONFIGURACIÓN GENERAL
       ================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #080808;
      font-family: Helvetica, Arial, sans-serif;
      color: white;
    }

    /* ==================================
       2. PORTADA CON TU IMAGEN
       ================================== */

    
/* PORTADA: IMAGEN PROPORCIONAL Y CON MÁRGENES */

.portada {
  width: 100%;
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 24px;

  position: relative;
  overflow: hidden;

  background-color: #080808;
}

/* IMAGEN DE PORTADA */

.portada::before {
  content: "";
  display: block;

  width: 100%;
  aspect-ratio: 2376 / 1480;

  background-image: url("PORTADA-2026.png");
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;

  transition: width 0.25s ease;
}

/* AJUSTE PARA CELULARES */

@media (max-width: 600px) {
  .portada {
    padding: 12px;
  }
}

    
/* ==================================
   BOTONES DE REDES SOCIALES
   ================================== */

.redes {
  position: absolute;
  top: 30px;
  left: 35px;

  display: flex;
  gap: 14px;
  align-items: center;

  z-index: 5;
}

.redes a {
  width: 43px;
  height: 43px;

  display: flex;
  justify-content: center;
  align-items: center;

  color: #c9a0ff;
  background: rgba(0, 0, 0, 0.08);

  border: 1px solid #c9a0ff;
  border-radius: 50%;

  text-decoration: none;

  transition: transform 0.3s ease,
              background-color 0.3s ease,
              box-shadow 0.3s ease,
              color 0.3s ease;

  backdrop-filter: blur(5px);
}

/* TAMAÑO DE LOS ÍCONOS */

.redes svg {
  width: 19px;
  height: 19px;

  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ANIMACIÓN AL PASAR EL CURSOR */

.redes a:hover {
  transform: translateY(-5px) scale(1.12);

  color: #ffffff;
  background: rgba(201, 160, 255, 0.18);

  box-shadow: 0 0 18px rgba(201, 160, 255, 0.4);
  z-index: 10;
}

/* ==================================
   SCROLL DOWN
   ================================== */

.indicador {
  position: absolute;

  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);

  color: #ffffff;
  font-size: 11px;
  letter-spacing: 3px;

  text-align: center;
  white-space: nowrap;

  opacity: 0.8;
  z-index: 5;

  animation: flotar 2s ease-in-out infinite;
}

/* PEQUEÑO MOVIMIENTO DEL TEXTO */

@keyframes flotar {
  0%, 100% {
    transform: translate(-50%, 0);
  }

  50% {
    transform: translate(-50%, -6px);
  }
}

/* ==================================
   AJUSTES PARA CELULARES
   ================================== */

@media (max-width: 600px) {
  .redes {
    top: 18px;
    left: 18px;
    gap: 9px;
  }

  .redes a {
    width: 38px;
    height: 38px;
  }

  .indicador {
    font-size: 9px;
    bottom: 20px;
    letter-spacing: 2px;
  }
}


    /* ==================================
       4. INDICADOR PARA DESLIZAR
       ================================== */

    .indicador {
      position: absolute;
      bottom: 35px;
      left: 40px;

      color: white;
      font-size: 11px;
      letter-spacing: 2px;
      opacity: 0.8;
    }

    /* ==================================
       5. ESPACIO DEL ÍNDICE
       ================================== */

    .indice {
      min-height: 100vh;
      padding: 100px 8%;
      background: #080808;
    }

    .indice h2 {
      color: #c9a0ff;
      font-size: clamp(35px, 6vw, 70px);
      margin-bottom: 40px;
    }

    /* Aquí agregaremos los apartados
       del portafolio más adelante. */

    /* ==================================
       6. ADAPTACIÓN PARA CELULARES
       ================================== */

    @media (max-width: 600px) {

      .portada {
        background-position: center;
      }

      .redes {
        right: 15px;
        bottom: 20px;
        gap: 6px;
      }

      .redes a {
        padding: 9px 10px;
        font-size: 10px;
      }

      .indicador {
        left: 15px;
        bottom: 85px;
        font-size: 9px;
      }
    }

  </style>
</head>

<body>

  <!-- ==================================
       PORTADA PRINCIPAL
       ================================== -->

  <section class="portada">

    <!-- BOTONES DE REDES SOCIALES -->

    <div class="redes">

      <!-- CAMBIA LOS ENLACES POR LOS TUYOS -->

      <a href="https://www.instagram.com/TUUSUARIO/"
         target="_blank">
        INSTAGRAM
      </a>

      <a href="https://www.tiktok.com/@TUUSUARIO"
         target="_blank">
        TIKTOK
      </a>

      <a href="https://www.linkedin.com/in/TUPERFIL/"
         target="_blank">
        LINKEDIN
      </a>

    </div>

    <!-- INDICADOR DE DESPLAZAMIENTO -->

    <div class="indicador">
      SCROLL TO EXPLORE ↓
    </div>

  </section>


  <!-- ==================================
       ÍNDICE (LO DESARROLLAREMOS DESPUÉS)
       ================================== -->

  <section class="indice" id="indice">

    <h2>ÍNDICE</h2>

    <!-- AQUÍ COLOCAREMOS LAS SECCIONES -->

  </section>

</body>
</html>
