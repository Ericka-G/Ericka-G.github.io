
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ericka Guillén | Portfolio</title>

  <style>
    /* =====================================
       1. DISEÑO GENERAL
       ===================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #080808;
      color: #ffffff;
      font-family: Helvetica, Arial, sans-serif;
    }

    /* =====================================
       2. PORTADA PRINCIPAL
       ===================================== */

    .portada {
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;

      /* CAMBIA ESTA IMAGEN CUANDO SUBAS TU PORTADA */
      background-image: url("assets/portada.jpeg");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Oscurece un poco la portada para que el texto destaque */
    .portada::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        135deg,
        rgba(0,0,0,0.25),
        rgba(20,0,35,0.25)
      );
    }

    /* =====================================
       3. TEXTO Y BOTÓN DE ENTRADA
       ===================================== */

    .contenido {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 30px;
    }

    .contenido h1 {
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 900;
      letter-spacing: -4px;
      text-transform: uppercase;
    }

    .contenido p {
      color: #d9b5ff;
      margin-top: 15px;
      font-size: 1rem;
      letter-spacing: 3px;
    }

    .boton {
      display: inline-block;
      margin-top: 35px;
      padding: 15px 38px;
      border: 1px solid #c58aff;
      color: white;
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 2px;
      transition: 0.3s;
    }

    .boton:hover {
      background: #c58aff;
      color: #080808;
    }

    /* =====================================
       4. RESPONSIVE: CELULARES
       ===================================== */

    @media (max-width: 600px) {
      .contenido h1 {
        letter-spacing: -2px;
      }

      .contenido p {
        font-size: 0.75rem;
        line-height: 1.6;
      }

      .portada {
        background-position: center;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================
       PORTADA PRINCIPAL
       Aquí aparece tu imagen de bienvenida.
       ===================================== -->

  <section class="portada">

    <div class="contenido">

      <h1>Ericka Guillén</h1>

      <p>3D ARTIST · ILLUSTRATOR · ANIMATOR</p>

      <!-- BOTÓN PARA ENTRAR AL PORTAFOLIO -->
      <a href="portfolio.html" class="boton">
        COMENZAR →
      </a>

    </div>

  </section>

</body>
</html>
